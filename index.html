<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berita Monitor — Playlist</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,sans-serif}
.grid{width:100vw;height:100vh;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;background:#07111f}
.tile{position:relative;background:#000}.tile iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.label{position:absolute;z-index:5;top:8px;left:8px;background:#000d;color:#fff;padding:7px 10px;border-radius:6px;font-weight:bold;pointer-events:none}
@media(max-width:800px){.grid{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="grid">
  <div class="tile">
    <div class="label">TV One</div>
    <iframe src="https://www.youtube.com/embed?listType=user_uploads&list=tvOneNews&autoplay=1&mute=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
  <div class="tile">
    <div class="label">Metro TV</div>
    <iframe src="https://www.youtube.com/embed?listType=user_uploads&list=METROTV&autoplay=1&mute=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
  <div class="tile">
    <div class="label">Kompas TV</div>
    <iframe src="https://www.youtube.com/embed?listType=user_uploads&list=kompastv&autoplay=1&mute=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
  <div class="tile">
    <div class="label">CNN Indonesia</div>
    <iframe src="https://www.youtube.com/embed?listType=user_uploads&list=CNNIndonesia&autoplay=1&mute=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
</div>
</body>
</html>
