<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berita Monitor</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #07111f; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100vw; height: 100vh; gap: 4px; background: #07111f; }
  .tile { position: relative; min-width: 0; min-height: 0; background: #000; overflow: hidden; }
  .label { position: absolute; z-index: 2; top: 8px; left: 8px; padding: 5px 9px; border-radius: 5px; background: rgba(0,0,0,.75); font-size: 14px; font-weight: 700; pointer-events: none; }
  .live { color: #ff4d4d; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .error { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px; color:#bbb; background:#050505; }
  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); }
  }
</style>
</head>
<body>
<div class="grid">
  <section class="tile">
    <div class="label"><span class="live">● LIVE</span> TV One</div>
    <iframe src="https://www.youtube.com/embed/4K8vd0sBwL8?autoplay=1&mute=1&playsinline=1" title="TV One" allow="autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>
  </section>

  <section class="tile">
    <div class="label"><span class="live">● LIVE</span> TVRI</div>
    <div class="error">Tempel URL embed/live TVRI di <b>config.js</b> untuk mengaktifkannya.</div>
  </section>

  <section class="tile">
    <div class="label"><span class="live">● LIVE</span> Kompas TV</div>
    <div class="error">Tempel URL embed/live Kompas TV di <b>config.js</b> untuk mengaktifkannya.</div>
  </section>

  <section class="tile">
    <div class="label"><span class="live">● LIVE</span> CNN Indonesia</div>
    <div class="error">Tempel URL embed/live CNN Indonesia di <b>config.js</b> untuk mengaktifkannya.</div>
  </section>
</div>
</body>
</html>
